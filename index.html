<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Treehouse Therapies — Employee Timeclock</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #2D5A3D;
    --green-mid: #4A8B5C;
    --green-light: #7BC47F;
    --green-pale: #E8F5E9;
    --cream: #FFF8F0;
    --cream-dark: #F5EDE3;
    --coral: #E57373;
    --coral-dark: #C62828;
    --amber: #FFB74D;
    --amber-dark: #F57C00;
    --sky: #4FC3F7;
    --sky-dark: #0288D1;
    --text: #3E2723;
    --text-light: #6D4C41;
    --shadow: rgba(45, 90, 61, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .header {
    width: 100%;
    background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-mid) 100%);
    padding: 20px;
    text-align: center;
  }
  .header img { width: 60px; height: 60px; border-radius: 12px; margin-bottom: 6px; }
  .header h1 { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 22px; color: #fff; }
  .header .subtitle { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 4px; font-weight: 600; }
  .container { width: 100%; max-width: 440px; padding: 20px; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px var(--shadow); margin-bottom: 16px; }
  .card h2 { font-family: 'Quicksand', sans-serif; font-size: 18px; font-weight: 700; color: var(--green-deep); margin-bottom: 16px; text-align: center; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-light); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
  .form-group select, .form-group input, .form-group textarea {
    width: 100%; padding: 14px 16px; border: 2px solid var(--cream-dark); border-radius: 12px;
    font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 600; color: var(--text);
    background: var(--cream); -webkit-appearance: none;
  }
  .form-group select:focus, .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--green-mid); background: #fff; }
  .pin-input { text-align: center; letter-spacing: 12px; font-size: 24px !important; }
  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--green-mid), var(--green-deep)); color: #fff; }
  .btn-clock-in { background: linear-gradient(135deg, var(--green-light), var(--green-mid)); color: #fff; padding: 24px; font-size: 20px; border-radius: 16px; }
  .btn-clock-out { background: linear-gradient(135deg, var(--coral), var(--coral-dark)); color: #fff; padding: 24px; font-size: 20px; border-radius: 16px; }
  .btn-break { background: linear-gradient(135deg, var(--amber), var(--amber-dark)); color: #fff; }
  .btn-break.on-break { background: linear-gradient(135deg, var(--sky), var(--sky-dark)); }
  .btn-secondary { background: var(--cream-dark); color: var(--text-light); }
  .action-stack { display: flex; flex-direction: column; gap: 12px; }
  .welcome-bar {
    background: #fff; border-radius: 16px; padding: 16px 20px;
    box-shadow: 0 2px 12px var(--shadow); display: flex;
    justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .welcome-name { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 16px; color: var(--green-deep); }
  .welcome-date { font-size: 13px; color: var(--text-light); font-weight: 600; }
  .logout-link { font-size: 13px; color: var(--coral); font-weight: 700; cursor: pointer; }
  .clock-display { text-align: center; margin-bottom: 16px; }
  .current-time { font-family: 'Quicksand', sans-serif; font-size: 48px; font-weight: 700; color: var(--green-deep); line-height: 1; }
  .current-date { font-size: 14px; color: var(--text-light); font-weight: 600; margin-top: 4px; }
  .status-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .status-row:not(:last-child) { border-bottom: 1px solid var(--cream-dark); }
  .status-label { font-size: 13px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
  .status-value { font-size: 15px; font-weight: 700; color: var(--green-deep); }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; text-transform: uppercase; }
  .badge-off { background: var(--cream-dark); color: var(--text-light); }
  .badge-clocked-in { background: #E8F5E9; color: var(--green-mid); }
  .badge-on-break { background: #FFF3E0; color: var(--amber-dark); }
  .summary-total { text-align: center; padding: 20px; background: var(--green-pale); border-radius: 12px; margin-bottom: 16px; }
  .big-number { font-family: 'Quicksand', sans-serif; font-size: 42px; font-weight: 700; color: var(--green-deep); }
  .big-label { font-size: 13px; color: var(--green-mid); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .success-screen { text-align: center; padding: 40px 20px; }
  .success-icon { font-size: 64px; margin-bottom: 16px; }
  .success-screen h2 { font-family: 'Quicksand', sans-serif; color: var(--green-deep); font-size: 22px; margin-bottom: 8px; }
  .success-screen p { color: var(--text-light); font-size: 15px; font-weight: 600; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--coral-dark); color: #fff; padding: 12px 24px; border-radius: 12px;
    font-weight: 700; font-size: 14px; z-index: 100; transition: transform 0.3s ease; max-width: 90%;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green-mid); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <img src="image/TTA_LOGO.png" alt="Treehouse Therapies" style="width:60px;height:60px;border-radius:12px;margin-bottom:6px;">
  <h1>Treehouse Therapies</h1>
  <div class="subtitle">Employee Timeclock</div>
</div>

<div class="container">

  <!-- LOGIN -->
  <div id="loginScreen" class="screen active">
    <div class="card">
      <h2>Sign In</h2>
      <div class="form-group">
        <label>Employee</label>
        <select id="employeeSelect">
          <option value="">Select your name...</option>
          <option value="0">Courtney Coleman</option>
          <option value="1">Florence Crombecque</option>
          <option value="2">Hailey Voss</option>
          <option value="3">Isabel Arreola</option>
          <option value="4">Jennifer Widder</option>
          <option value="5">Julie Earnest</option>
        </select>
      </div>
      <div class="form-group">
        <label>PIN</label>
        <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••" inputmode="numeric" pattern="[0-9]*">
      </div>
      <button class="btn btn-primary" onclick="handleLogin()">Sign In</button>
    </div>
  </div>

  <!-- TIMECLOCK -->
  <div id="clockScreen" class="screen">
    <div class="welcome-bar">
      <div>
        <div class="welcome-name" id="welcomeName">—</div>
        <div class="welcome-date" id="welcomeDate">—</div>
      </div>
      <a class="logout-link" onclick="handleLogout()">Sign Out</a>
    </div>

    <div class="card">
      <div class="clock-display">
        <div class="current-time" id="liveTime">--:--</div>
        <div class="current-date" id="liveDate">—</div>
      </div>
    </div>

    <div class="card">
      <div class="status-row">
        <span class="status-label">Status</span>
        <span class="status-badge badge-off" id="statusBadge">Not Clocked In</span>
      </div>
      <div class="status-row">
        <span class="status-label">Clocked In</span>
        <span class="status-value" id="clockInTime">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Break Time</span>
        <span class="status-value" id="breakTotal">0 min</span>
      </div>
      <div class="status-row">
        <span class="status-label">Hours Worked</span>
        <span class="status-value" id="hoursWorked">0.00</span>
      </div>
    </div>

    <div class="action-stack" id="actionButtons">
      <button class="btn btn-clock-in" onclick="handleClockIn()">🕐 Clock In</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div id="summaryScreen" class="screen">
    <div class="card">
      <h2>Shift Summary</h2>
      <div class="summary-total">
        <div class="big-number" id="summaryHours">0.00</div>
        <div class="big-label">Total Hours</div>
      </div>
      <div class="status-row"><span class="status-label">Clock In</span><span class="status-value" id="summaryIn">—</span></div>
      <div class="status-row"><span class="status-label">Clock Out</span><span class="status-value" id="summaryOut">—</span></div>
      <div class="status-row"><span class="status-label">Break</span><span class="status-value" id="summaryBreak">—</span></div>
      <div class="form-group" style="margin-top:12px;">
        <textarea id="shiftNotes" placeholder="Add shift notes (optional)..." style="width:100%;padding:14px;border:2px solid var(--cream-dark);border-radius:12px;font-family:'Nunito',sans-serif;font-size:15px;color:var(--text);background:var(--cream);resize:vertical;min-height:80px;"></textarea>
      </div>
    </div>
    <div class="action-stack">
      <button class="btn btn-primary" id="btnSubmit" onclick="handleSubmit()">✓ Submit Timesheet</button>
      <button class="btn btn-secondary" onclick="goBack()">← Go Back</button>
    </div>
  </div>

  <!-- SUCCESS -->
  <div id="successScreen" class="screen">
    <div class="success-screen">
      <div class="success-icon">✅</div>
      <h2>Time Submitted!</h2>
      <p id="successMsg">Your hours have been recorded.</p>
      <br><br>
      <button class="btn btn-primary" onclick="handleLogout()">Done</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════
// CONFIG — Update these two things only
// ════════════════════════════════════════

// ⬇️ PASTE YOUR GOOGLE APPS SCRIPT URL HERE ⬇️
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzaBM9ODdE6rmG77AY1MaTohEmelo265jewe_T4g6d_1jXE2bluy2CCSG18ydHwIEt7Jw/exec';

// Employee list — update when staff changes
const EMPLOYEES = [
  { name: 'Courtney Coleman', pin: '7891' },
  { name: 'Florence Crombecque', pin: '5289' },
  { name: 'Hailey Voss', pin: '5678' },
  { name: 'Isabel Arreola', pin: '3456' },
  { name: 'Jennifer Widder', pin: '2345' },
  { name: 'Julie Earnest', pin: '1234' },
];

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let currentEmployee = null;
let clockInTime = null;
let clockOutTime = null;
let onBreak = false;
let breakStartTime = null;
let totalBreakMs = 0;

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  setInterval(updateClock, 1000);
  updateClock();
  document.getElementById('pinInput').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
});

// ════════════════════════════════════════
// CLOCK DISPLAY
// ════════════════════════════════════════
function updateClock() {
  const now = new Date();
  const el = document.getElementById('liveTime');
  const dl = document.getElementById('liveDate');
  if (el) el.textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
  if (dl) dl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  if (clockInTime) {
    const breakNow = onBreak ? (now - breakStartTime) : 0;
    const elapsed = now - clockInTime - totalBreakMs - breakNow;
    document.getElementById('hoursWorked').textContent = Math.max(0, elapsed / 3600000).toFixed(2);
  }
}

// ════════════════════════════════════════
// SCREENS
// ════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showToast(msg, type = 'error') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'success' ? ' success' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

// ════════════════════════════════════════
// LOGIN / LOGOUT
// ════════════════════════════════════════
function handleLogin() {
  const idx = document.getElementById('employeeSelect').value;
  const pin = document.getElementById('pinInput').value;
  if (idx === '') { showToast('Please select your name'); return; }
  if (!pin) { showToast('Please enter your PIN'); return; }

  const emp = EMPLOYEES[parseInt(idx)];
  if (emp.pin !== pin) { showToast('Incorrect PIN'); return; }

  currentEmployee = emp.name;
  const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  document.getElementById('welcomeName').textContent = 'Hi, ' + emp.name.split(' ')[0] + '!';
  document.getElementById('welcomeDate').textContent = dateStr;
  showScreen('clockScreen');
}

function handleLogout() {
  currentEmployee = null;
  clockInTime = null;
  clockOutTime = null;
  onBreak = false;
  breakStartTime = null;
  totalBreakMs = 0;
  document.getElementById('employeeSelect').value = '';
  document.getElementById('pinInput').value = '';
  document.getElementById('hoursWorked').textContent = '0.00';
  document.getElementById('clockInTime').textContent = '—';
  document.getElementById('breakTotal').textContent = '0 min';
  updateBadge('off');
  renderButtons();
  showScreen('loginScreen');
}

// ════════════════════════════════════════
// CLOCK ACTIONS
// ════════════════════════════════════════
function handleClockIn() {
  clockInTime = new Date();
  totalBreakMs = 0;
  document.getElementById('clockInTime').textContent = formatTime(clockInTime);
  updateBadge('clocked-in');
  renderButtons();
}

function handleBreak() {
  if (!onBreak) {
    onBreak = true;
    breakStartTime = new Date();
    updateBadge('on-break');
  } else {
    onBreak = false;
    totalBreakMs += (new Date() - breakStartTime);
    breakStartTime = null;
    updateBadge('clocked-in');
  }
  document.getElementById('breakTotal').textContent = getBreakMin() + ' min';
  renderButtons();
}

function handleClockOut() {
  if (onBreak) {
    totalBreakMs += (new Date() - breakStartTime);
    onBreak = false;
    breakStartTime = null;
  }
  clockOutTime = new Date();
  const totalMs = clockOutTime - clockInTime - totalBreakMs;
  const hours = Math.max(0, totalMs / 3600000);

  document.getElementById('summaryHours').textContent = hours.toFixed(2);
  document.getElementById('summaryIn').textContent = formatTime(clockInTime);
  document.getElementById('summaryOut').textContent = formatTime(clockOutTime);
  document.getElementById('summaryBreak').textContent = getBreakMin() + ' min';
  document.getElementById('shiftNotes').value = '';
  showScreen('summaryScreen');
}

function goBack() {
  clockOutTime = null;
  updateBadge('clocked-in');
  renderButtons();
  showScreen('clockScreen');
}

// ════════════════════════════════════════
// SUBMIT
// ════════════════════════════════════════
async function handleSubmit() {
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Submitting...';

  const totalMs = clockOutTime - clockInTime - totalBreakMs;
  const hours = Math.max(0, totalMs / 3600000);

  const payload = {
    employee: currentEmployee,
    date: clockInTime.toLocaleDateString('en-US'),
    clockIn: formatTime(clockInTime),
    clockOut: formatTime(clockOutTime),
    breakMinutes: Math.round(totalBreakMs / 60000),
    totalHours: parseFloat(hours.toFixed(2)),
    notes: document.getElementById('shiftNotes').value.trim()
  };

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });

    document.getElementById('successMsg').textContent = hours.toFixed(2) + ' hours recorded for ' + payload.date;
    showScreen('successScreen');
  } catch (err) {
    showToast('Error submitting. Try again.');
    btn.disabled = false;
    btn.innerHTML = '✓ Submit Timesheet';
  }
}

// ════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════
function renderButtons() {
  const c = document.getElementById('actionButtons');
  if (!clockInTime || clockOutTime) {
    c.innerHTML = '<button class="btn btn-clock-in" onclick="handleClockIn()">🕐 Clock In</button>';
  } else {
    const bLabel = onBreak ? '☕ End Break' : '☕ Start Break';
    const bClass = onBreak ? 'btn-break on-break' : 'btn-break';
    c.innerHTML =
      '<button class="btn ' + bClass + '" onclick="handleBreak()">' + bLabel + '</button>' +
      '<button class="btn btn-clock-out" onclick="handleClockOut()"' + (onBreak ? ' disabled' : '') + '>🔴 Clock Out</button>';
  }
}

function updateBadge(status) {
  const b = document.getElementById('statusBadge');
  b.className = 'status-badge';
  if (status === 'clocked-in') { b.classList.add('badge-clocked-in'); b.textContent = 'Clocked In'; }
  else if (status === 'on-break') { b.classList.add('badge-on-break'); b.textContent = 'On Break'; }
  else { b.classList.add('badge-off'); b.textContent = 'Not Clocked In'; }
}

function formatTime(d) { return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }); }

function getBreakMin() {
  let ms = totalBreakMs;
  if (onBreak && breakStartTime) ms += (new Date() - breakStartTime);
  return Math.round(ms / 60000);
}
</script>
</body>
</html>
